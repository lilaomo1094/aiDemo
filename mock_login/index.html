<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商户登录</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
        .login-box { background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 320px; }
        h2 { margin-top: 0; color: #333; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; color: #666; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #4CAF50; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #45a049; }
        .error { color: #d32f2f; margin-top: 10px; text-align: center; min-height: 20px; }
        .success { color: #388e3c; margin-top: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>商户登录</h2>
        <div class="form-group">
            <label for="phone">手机号</label>
            <input type="text" id="phone" name="phone" placeholder="请输入手机号">
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" placeholder="请输入密码">
        </div>
        <button id="login-btn" type="button">登录</button>
        <div id="message" class="error"></div>
    </div>
    <script>
        document.getElementById('login-btn').addEventListener('click', function() {
            var phone = document.getElementById('phone').value.trim();
            var password = document.getElementById('password').value;
            var msgEl = document.getElementById('message');
            msgEl.className = 'error';
            if (!phone) {
                msgEl.textContent = '请输入手机号';
                return;
            }
            if (!/^1\d{10}$/.test(phone)) {
                msgEl.textContent = '手机号格式不正确';
                return;
            }
            if (!password) {
                msgEl.textContent = '请输入密码';
                return;
            }
            if (phone === '13411985758' && password === '888888') {
                msgEl.className = 'success';
                msgEl.textContent = '登录成功，正在跳转...';
                setTimeout(function() {
                    window.location.href = '/#/dashboard';
                }, 500);
            } else {
                msgEl.textContent = '账号或密码错误';
            }
        });
    </script>
</body>
</html>
